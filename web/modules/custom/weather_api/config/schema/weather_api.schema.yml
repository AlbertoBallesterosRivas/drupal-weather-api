weather_api.settings:
  type: config_object
  label: 'Weather API Settings'
  mapping:
    api_key:
      type: string
      label: 'OpenWeatherMap API Key'
    default_city:
      type: string
      label: 'Default City'
    max_history_records:
      type: integer
      label: 'Maximum History Records'
    refresh_interval:
      type: integer
      label: 'Auto-refresh Interval (milliseconds)'
    geolocation_enabled:
      type: boolean
      label: 'Enable Geolocation'
    units:
      type: string
      label: 'Temperature Units'
    language:
      type: string
      label: 'Weather Language'
    features:
      type: mapping
      label: 'Enabled Features'
      mapping:
        history:
          type: boolean
          label: 'Enable History'